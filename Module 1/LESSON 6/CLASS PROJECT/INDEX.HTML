<!DOCTYPE html>
<html>
    <head>
        <title>forms</title>
    </head>
    <body>
        <h1>your gaming form</h1>
        <p>In this form you will be asked some questions and you have to answer them about your gaming carear</p>
        <form>
          <fieldset>
            <legend>your personal details</legend>
            <label>Your name:</label>:
            <input type="ext" placeholder="write your name">
             <br><label>Your gaming school:</label>
            <input type="text" placeholder=" wour gaming school">
            <br><label>Your date of birth:</label>
            <input type="date" placeholder="mm/dd/yyyy">

          </fieldset>  
          <fieldset>
            <legend>About your gaming carear</legend>
            <select>your experience
            <option>1 year</option>
            <option>5 year</option>
            <option>10 years</option>
            <option>15 years</option></select>
          </fieldset>
          <fieldset>
            <legend>which game you play</legend>
            <select>
              <option>Fc mobile</option>
              <option>Fifa</option>
              <option>Minecraft</option>
              <option>Free Fire</option>
            </select>
          </fieldset>
          <fieldset>
            <legend>select your setup</legend>
            <label>in which setup you play</label>
            <input type="radio"> PC(personal computer)
            <input type="radio"> Mobile  
            <input type="radio"> console
            <input type="radio"> Laptop
          </fieldset>
        </form>
        <button>submit the form</button>
    </body>
</html>
